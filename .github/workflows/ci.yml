name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-build-test:
    name: Backend Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=backend

      - name: Lint Backend
        run: npm run lint --workspace=backend

      - name: Build Backend (TypeScript Compilation)
        run: npm run build --workspace=backend

      - name: Run Backend Unit Tests (Isolated SLA & Business Logic)
        run: npm run test:unit --workspace=backend

  frontend-lint-build:
    name: Frontend Lint & Production Bundle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Lint Frontend
        run: npm run lint --workspace=frontend

      - name: Build Frontend (Vite Bundle)
        run: npm run build --workspace=frontend
